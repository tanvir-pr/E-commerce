name: store

x-api: &api
  build:
    context: ./apps/api
  image: store-api:week1
  env_file:
    - .env
  environment:
    APP_ENV: local
    DATABASE_URL: postgresql+asyncpg://store:store@postgres:5432/store
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    PUBLIC_WEB_URL: http://localhost:3000
    CORS_ORIGIN: http://localhost:3000
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - store_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    <<: *api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *api
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  store_pg:
